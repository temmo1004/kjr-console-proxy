# 對外探活：從 GitHub 打 https://api.hakkaren.uk/healthz，機器躺下時 bath 上的 extprobe/alertguard 也躺下，這條在外面。
# 狀態用 label=down 的 issue 記（開=故障中，關=恢復），轉態才寄信（Resend，同 alert_guard 管道），不洗版。
# ponytail: GitHub cron 最小 5 分、尖峰會晚到 5–15 分；公開 repo 60 天沒 commit 會被 GitHub 自動停排程（repo 有動就續命）。
name: uptime
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 探活 URL（測故障路徑可填假網址）
        default: https://api.hakkaren.uk/healthz
permissions:
  issues: write
concurrency: uptime
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      URL: ${{ inputs.url || 'https://api.hakkaren.uk/healthz' }}
    steps:
      - name: probe (3 tries, 20s apart)
        id: p
        run: |
          ok=0
          for i in 1 2 3; do
            body=$(curl -s -m 10 -w '\n%{http_code}' "$URL" 2>/dev/null || true)
            code=${body##*$'\n'}
            if [ "$code" = 200 ] && printf '%s' "$body" | grep -q '"status": "ok"'; then ok=1; break; fi
            echo "try $i: http=$code body=$(printf '%s' "$body" | head -c 120)"
            [ $i -lt 3 ] && sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "probe ok=$ok url=$URL"
      - name: state + notify on transition
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          OK: ${{ steps.p.outputs.ok }}
        run: |
          set -e
          now=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          open=$(gh issue list --label down --state open --json number,title,createdAt --jq '.[0]')
          mail() {  # $1=subject $2=text
            [ -n "$RESEND_API_KEY" ] || { echo "no RESEND_API_KEY, skip mail"; return 0; }
            jq -nc --arg f "$MAIL_FROM" --arg t "$ALERT_TO" --arg s "$1" --arg b "$2" \
              '{from:$f,to:[$t],subject:$s,html:("<pre>"+$b+"</pre>")}' \
            | curl -s -m 20 -o /dev/null -w 'resend http=%{http_code}\n' https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" -H 'Content-Type: application/json' -d @-
          }
          if [ "$OK" = 1 ]; then
            if [ -n "$open" ]; then
              n=$(jq -r .number <<<"$open"); since=$(jq -r .createdAt <<<"$open")
              gh issue close "$n" -c "✅ 恢復 $now（台北）"
              mail "[客加人] ✅ api.hakkaren.uk 恢復 $now" "healthz 回 200 ok。故障自 $since (UTC) 起，issue #$n 已關。"
              echo "transition: down -> up (issue #$n closed)"
            else echo "up, no open issue"; fi
          else
            if [ -z "$open" ]; then
              gh label create down -c B60205 -d "api.hakkaren.uk 對外探活失敗中" 2>/dev/null || true
              url=$(gh issue create --label down -t "🔴 api.hakkaren.uk healthz down $now" \
                    -b "3 次探活（20s 間隔）皆失敗。URL: $URL。Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
              mail "[客加人] 🔴 api.hakkaren.uk 對外 healthz 失敗 $now" "連 3 次（20s 間隔）打 $URL 沒拿到 200 {\"status\": \"ok\"}。多半是 bath Mac mini 沒起（停電/重開停在登入畫面）或 GCP Caddy→Funnel 斷。$url"
              echo "transition: up -> down ($url)"
            else echo "still down, issue open, no re-mail"; fi
          fi
